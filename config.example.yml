# Copy to config.yml (git-ignored) and adjust. Secrets come from environment variables.
agent:
  name: Scribe        # how the agent introduces itself and appears in the minutes
  aliases: []         # other ways to address it, e.g. how Whisper misspells the name (not hinted to Whisper)
data_dir: ~/.local/share/kb-meeting-agent

llm:
  # Everything local (Ollama on a Mac mini). Temperature 0: the same question gets the same
  # answer (Ollama samples at 0.8 otherwise). max_tokens stops a model repeating itself.
  fast:      { provider: openai-compatible, base_url: "http://localhost:11434/v1", model: "qwen3:14b", request_options: { reasoning_effort: "none", temperature: 0, max_tokens: 8192 } }
  embedding: { provider: openai-compatible, base_url: "http://localhost:11434/v1", model: "bge-m3" }
  # Or Claude for the heavy steps:
  strong:    { provider: anthropic, model: claude-opus-5-5, api_key: "${ANTHROPIC_API_KEY}", effort: high, refusal_fallback: true }
  # A cheaper Claude model for the frequent detection steps:
  # fast:    { provider: anthropic, model: claude-haiku-5-5, api_key: "${ANTHROPIC_API_KEY}" }

# A project groups the repositories a meeting searches. Each repository is tagged
# KnowledgeBase (exactly one per project: answers, fact-checks, decisions and minutes) or
# CodeBase (read only: answers and the code files listed in decision pull requests), plus
# free tags of your choice that label citations and steer the search (FrontEnd, BackEnd...).
projects:
  my-project:
    repos:
      kb:
        repo: owner/my-kb
        base_branch: main
        tags: [KnowledgeBase]
        token: "${GITHUB_TOKEN}"   # needed to publish or to read a private KB; remove otherwise
        # Language, decision record format and allowed scopes, minutes folder and index: these
        # belong to the KB, in its .meeting-agent.yml (docs/configuration.md#kb-conventions-meeting-agentyml).
      # Code repositories are optional. A read-only token is enough.
      # back:
      #   repo: owner/my-backend
      #   tags: [CodeBase, BackEnd]
      #   token: "${GITHUB_CODE_TOKEN}"
      # front:
      #   repo: owner/my-app
      #   base_branch: master
      #   tags: [CodeBase, FrontEnd]
      #   token: "${GITHUB_CODE_TOKEN}"
      #   exclude: ["assets/**"]

defaults:
  # project: my-project       # required with several projects: the one a meeting starts on
  intervention_level: contradictions
  contradiction_min_confidence: 0.8
  stale_page_days: 60

