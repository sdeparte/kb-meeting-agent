# Slack app manifest for kb-meeting-agent's Slack connector. Create the app from it at
# https://api.slack.com/apps → Create New App → From a manifest (see README.md).
display_information:
  name: kb-meeting-agent
  description: Transcribes huddles, answers from the project's knowledge base, opens decision pull requests.
features:
  bot_user:
    display_name: kb-meeting-agent
    always_online: true
  slash_commands:
    - command: /meeting
      # The commands and their words come from the core (src/kb_meeting_agent/commands.py): not listed here.
      description: "Meeting agent commands: /meeting aide lists them"
      usage_hint: "<command> [arguments]"
      should_escape: false
    - command: /ask
      description: Ask the agent about the project
      usage_hint: "<question>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - users:read
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - user_huddle_changed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
